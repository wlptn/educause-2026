# Ansible Automation Platform operator.
# NOTE: verify the channel exists on this cluster before applying:
#   oc get packagemanifest ansible-automation-platform-operator \
#     -n openshift-marketplace -o jsonpath='{.status.channels[*].name}{"\n"}'
# Adjust `channel` below if stable-2.7 is not offered.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform-operator
  namespace: aap
spec:
  channel: stable-2.7
  installPlanApproval: Automatic
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
