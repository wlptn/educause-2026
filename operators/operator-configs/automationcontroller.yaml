# Standalone controller lives in the automationcontroller.ansible.com group;
# aap.ansible.com only owns the unified AnsibleAutomationPlatform CR.
# v1beta1 is the served/storage version on AAP 2.7 (verified on a live RHDP cluster).
apiVersion: automationcontroller.ansible.com/v1beta1
kind: AutomationController
metadata:
  name: aap-controller
  namespace: aap
spec:
  replicas: 1
  admin_user: admin
  # admin_password_secret: aap-admin-password
  postgres_storage_class: ""  # uses default StorageClass
  postgres_storage_requirements:
    requests:
      storage: 8Gi
