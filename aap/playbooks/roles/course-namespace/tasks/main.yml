---
- name: Create course namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ course_namespace }}"
        annotations:
          educause.demo/course-name-display: "{{ course_name }}"
          educause.demo/env-duration: "{{ env_duration | default('semester') }}"
          educause.demo/env-expires: "{{ semester_end | default('manual') }}"
          educause.demo/provisioned-at: "{{ ansible_date_time.iso8601 }}"
        labels:
          educause.demo/course-code: "{{ course_code }}"
          educause.demo/course-name: "{{ course_name | regex_replace('[^a-zA-Z0-9._-]', '-') | truncate(63, True, '') }}"
          educause.demo/department: "{{ department }}"
          educause.demo/semester: "{{ semester_start[:7] | default('unknown') }}"
          educause.demo/managed-by: aap
          insights_cost_management_optimizations: "true"

- name: Apply resource quota
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: course-quota
        namespace: "{{ course_namespace }}"
      spec:
        hard:
          requests.cpu: "{{ student_count | int * 1 }}"
          requests.memory: "{{ student_count | int * 2 }}Gi"
          limits.cpu: "{{ student_count | int * 2 }}"
          limits.memory: "{{ student_count | int * 4 }}Gi"
          persistentvolumeclaims: "{{ student_count | int + 5 }}"

- name: Allow ingress from OpenShift router
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-ingress
        namespace: "{{ course_namespace }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    network.openshift.io/policy-group: ingress

- name: Allow ingress from RHOAI components
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-rhoai
        namespace: "{{ course_namespace }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: redhat-ods-applications
