---
# One-time setup: configures AAP Controller with the inventory, project,
# credentials, and job templates (with course-offering dropdowns) for the demo.
#
# Auth uses a GATEWAY API token (Access Management -> API Tokens, Write scope):
# ansible.controller username/password token-creation 404s behind the AAP 2.5+
# platform gateway, so we authenticate with a pre-minted token. controller_host
# is the gateway URL; the collection routes to /api/controller/ automatically.
#
# Usage:
#   export CONTROLLER_HOST=https://aap-aap.apps.<sandbox>.opentlc.com
#   export CONTROLLER_OAUTH_TOKEN=<gateway API token, Write scope>
#   export GIT_URL=https://github.com
#   export GIT_USER=wlptn
#   export MODEL_API_KEY=<shared-maas-api-key>
#   export MODEL_ENDPOINT=http://maas.apps.<sandbox>.opentlc.com/llm/qwen3-4b-instruct/v1
#   export MODEL_NAME=qwen3-4b-instruct
#   export K8S_HOST=https://api.ocp.<sandbox>.opentlc.com:6443
#   export K8S_BEARER_TOKEN=$(oc whoami -t)
#   ansible-playbook aap/playbooks/setup-controller.yml
#
- name: Configure AAP Controller for Educause demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    controller_oauthtoken: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
    controller_validate_certs: false
    git_url: "{{ lookup('env', 'GIT_URL') | default('https://github.com', true) }}"
    git_user: "{{ lookup('env', 'GIT_USER') | default('wlptn', true) }}"
    model_api_key: "{{ lookup('env', 'MODEL_API_KEY') }}"
    model_endpoint: "{{ lookup('env', 'MODEL_ENDPOINT') | default('http://maas.apps.ocp.CHANGEME.opentlc.com/llm/qwen3-4b-instruct/v1', true) }}"
    model_name: "{{ lookup('env', 'MODEL_NAME') | default('qwen3-4b-instruct', true) }}"
    organization_name: "Default"

  tasks:
    - name: Create Demo Inventory (localhost) for the job templates
      ansible.controller.inventory:
        name: "Demo Inventory"
        organization: "{{ organization_name }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Add localhost to Demo Inventory
      ansible.controller.host:
        name: "localhost"
        inventory: "Demo Inventory"
        state: present
        variables:
          ansible_connection: local
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create OpenShift credential
      ansible.controller.credential:
        name: "OpenShift Cluster"
        organization: "{{ organization_name }}"
        credential_type: "OpenShift or Kubernetes API Bearer Token"
        inputs:
          host: "{{ lookup('env', 'K8S_HOST') | default('https://api.ocp.CHANGEME.opentlc.com:6443', true) }}"
          verify_ssl: false
          bearer_token: "{{ lookup('env', 'K8S_BEARER_TOKEN') | default(omit) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"
      when: lookup('env', 'K8S_BEARER_TOKEN') | length > 0

    - name: Create project from Git repo
      ansible.controller.project:
        name: "Educause 2026"
        organization: "{{ organization_name }}"
        scm_type: git
        scm_url: "{{ git_url }}/{{ git_user }}/educause-2026.git"
        scm_branch: rhdp
        scm_update_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Wait for project sync
      ansible.controller.project_update:
        project: "Educause 2026"
        organization: "{{ organization_name }}"
        wait: true
        timeout: 120
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Store model API key as a custom credential type
      ansible.controller.credential_type:
        name: "MaaS API Key"
        kind: cloud
        inputs:
          fields:
            - id: model_api_key
              label: API Key
              type: string
              secret: true
            - id: model_endpoint
              label: Endpoint URL
              type: string
            - id: model_name
              label: Model Name
              type: string
        injectors:
          extra_vars:
            model_api_key: "{% raw %}{{ model_api_key }}{% endraw %}"
            model_endpoint: "{% raw %}{{ model_endpoint }}{% endraw %}"
            model_name: "{% raw %}{{ model_name }}{% endraw %}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create MaaS Gateway credential
      ansible.controller.credential:
        name: "MaaS Gateway"
        organization: "{{ organization_name }}"
        credential_type: "MaaS API Key"
        inputs:
          model_api_key: "{{ model_api_key }}"
          model_endpoint: "{{ model_endpoint }}"
          model_name: "{{ model_name }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create Provision Course job template
      ansible.controller.job_template:
        name: "Provision Course Environment"
        description: "Self-service: creates namespace, model access, and workbenches for a course"
        organization: "{{ organization_name }}"
        project: "Educause 2026"
        playbook: "aap/playbooks/provision.yml"
        extra_vars:
          cluster_domain: "{{ lookup('env', 'CLUSTER_APPS_DOMAIN') | default('apps.ocp.CHANGEME.opentlc.com', true) }}"
          workbench_images:
            jupyter: "{{ lookup('env', 'WORKBENCH_IMAGE') | default('image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-minimal-notebook:2025.2', true) }}"
        inventory: "Demo Inventory"
        credentials:
          - "OpenShift Cluster"
          - "MaaS Gateway"
        survey_enabled: true
        survey_spec:
          name: "Course Details"
          description: "Choose a course offering to provision an AI lab environment"
          spec:
            - question_name: "Course"
              question_description: "Selecting a course sets its name, code, department, and content pack automatically"
              variable: course_preset
              type: multiplechoice
              required: true
              default: "cs485-intro-to-ai"
              choices:
                - cs485-intro-to-ai
                - stat200-data-science
                - bus350-ai-for-business
            - question_name: "Professor Email"
              variable: professor_email
              type: text
              required: true
              default: "prof.smith@university.edu"
              max: 128
            - question_name: "Number of Students"
              variable: student_count
              type: integer
              required: true
              default: 3
              min: 1
              max: 50
            - question_name: "Environment Duration"
              question_description: "How long the environment stays active before automatic teardown"
              variable: env_duration
              type: multiplechoice
              required: true
              default: "4h"
              choices:
                - 2h
                - 4h
                - 8h
                - 24h
                - 7d
                - semester
            - question_name: "Workbench Type"
              variable: workbench_type
              type: multiplechoice
              required: true
              default: jupyter
              choices:
                - jupyter
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create Teardown Course job template
      ansible.controller.job_template:
        name: "Teardown Course Environment"
        description: "Self-service: removes namespace and all resources for a course"
        organization: "{{ organization_name }}"
        project: "Educause 2026"
        playbook: "aap/playbooks/teardown.yml"
        extra_vars:
          cluster_domain: "{{ lookup('env', 'CLUSTER_APPS_DOMAIN') | default('apps.ocp.CHANGEME.opentlc.com', true) }}"
        inventory: "Demo Inventory"
        credentials:
          - "OpenShift Cluster"
        survey_enabled: true
        survey_spec:
          name: "Teardown Confirmation"
          description: "Confirm teardown of a course environment"
          spec:
            - question_name: "Course"
              question_description: "Select the course to tear down"
              variable: course_preset
              type: multiplechoice
              required: true
              default: "cs485-intro-to-ai"
              choices:
                - cs485-intro-to-ai
                - stat200-data-science
                - bus350-ai-for-business
            - question_name: "Professor Email (for confirmation)"
              variable: professor_email
              type: text
              required: true
              default: "prof.smith@university.edu"
              max: 128
            - question_name: "Confirm Teardown"
              question_description: "Select 'yes' to confirm deletion of all course resources"
              variable: confirm_teardown
              type: multiplechoice
              required: true
              default: "no"
              choices:
                - "yes"
                - "no"
        state: present
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "AAP Controller configured."
          - "Project: Educause 2026 (git {{ git_url }}/{{ git_user }}, branch rhdp)"
          - "Inventory: Demo Inventory (localhost)"
          - "Credentials: OpenShift Cluster, MaaS Gateway"
          - "Job Templates: Provision / Teardown Course Environment (course-offering dropdown)"
          - "Launch 'Provision Course Environment' and pick a course."
